<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>
</head>
<body>
    <h1>Welcome to My Coding Journey</h1>
    <p>I am learning front-end development from scratch!</p>

    <!-- Project Section Container -->
    <div>
        <h2>My Current Learning List</h2>
        <ul>
            <li>HTML5 Layouts</li>
            <li>CSS3 Styling</li>
            <li>JavaScript Logic</li>
        </ul>
    </div>

        <h2>Join My Newsletter</h2>

            <label for="useremail">Email:</label>

            <input type="submit" value="Subscribe Now">
        </form>
