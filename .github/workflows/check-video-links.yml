name: Check Academy video links

# Weekly: makes sure every YouTube video the Academy links to still exists
# (see scripts/check_video_links.py). A failed run emails the repo owner.
on:
  schedule:
    - cron: '0 8 * * 1' # 08:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_video_links.py
