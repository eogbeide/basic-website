name: Refresh live job listings

# Daily: pull fresh "who's hiring" listings for every role/pathway from
# each benchmark company's own public job-board API (see
# scripts/build_jobs_data.py), filtered to postings from the last 7 days.
# Regenerates the static catalog pages + sitemap so the refreshed data is
# baked into the deployed HTML, commits the result, then deploys to
# production on Vercel.
on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC daily (~4am Pacific / ~7am Eastern)
  workflow_dispatch: {} # allows a manual "Run workflow" trigger too

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # jsdom 30's bundled undici needs Node ^22.22.2 / ^24.15.0 / >=26 -- Node 20 fails with "markAsUncloneable is not a function"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Refresh job listings + regenerate static pages + sitemap
        run: npm run refresh-jobs

      - name: Commit refreshed data (if anything changed)
        id: commit
        run: |
          git config user.name "zuyini-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add academy/data/jobs.json academy/data/data.js academy/roles academy/pathways sitemap.xml robots.txt .static-academy-urls.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "Daily refresh: live job listings ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (production)
        if: steps.commit.outputs.changed == 'true'
        run: npx vercel --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
